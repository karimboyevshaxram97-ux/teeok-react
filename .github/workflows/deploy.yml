name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Bir vaqtda ikkita deploy yurmasin — keyingisi navbatda kutadi
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci emas: Windows'da generatsiya qilingan lock-fayl Linux'da
      # qat'iy moslik tekshiruvidan o'tmaydi (Dockerfile'dagi bilan bir xil sabab)
      - run: npm install
        working-directory: teeok-loyixasi
      - run: npx tsc --noEmit
        working-directory: teeok-loyixasi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Serverda deploy.sh ni ishga tushirish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: cd ~/tteok-deploy && ./deploy.sh
